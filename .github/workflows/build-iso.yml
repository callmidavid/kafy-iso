name: Build Kafy OS ISO

on:
  workflow_dispatch:
    inputs:
      kafy_ref:
        description: Kafy source branch, tag, or commit to bake into the ISO
        required: false
        default: main
  push:
    paths:
      - "archiso/**"
      - ".github/workflows/build-iso.yml"

env:
  KAFY_SOURCE_REPOSITORY: King12-D/kafyOS

jobs:
  build-iso:
    name: Build Arch ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout ISO builder
        uses: actions/checkout@v4
        with:
          path: kafy-iso

      - name: Checkout Kafy source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KAFY_SOURCE_REPOSITORY }}
          ref: ${{ inputs.kafy_ref || 'main' }}
          path: kafy

      - name: Build Kafy Arch ISO
        run: |
          docker run --rm \
            --privileged \
            -v "$GITHUB_WORKSPACE/kafy-iso:/iso:ro" \
            -v "$GITHUB_WORKSPACE/kafy:/kafy:ro" \
            -v "$GITHUB_WORKSPACE/artifacts:/output" \
            -v "$GITHUB_WORKSPACE/kafy-iso/cache/pkg:/var/cache/pacman/pkg" \
            -v "$GITHUB_WORKSPACE/kafy-iso/cache/db:/var/lib/pacman/sync" \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm archiso && cd /iso/archiso && KAFY_SOURCE=/kafy KAFY_WORK_DIR=/tmp/kafy-archiso-work ./build.sh /output'

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: kafy-os-x86_64-iso
          path: |
            artifacts/*.iso
            artifacts/*.iso.sha256
          retention-days: 14
